basePath: /api/v1
definitions:
  controller.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  controller.SMTPTestRequest:
    properties:
      host:
        type: string
      password:
        type: string
      port:
        type: string
      username:
        type: string
    required:
    - host
    - port
    type: object
  controller.SMTPTestResponse:
    properties:
      host:
        type: string
      message:
        type: string
      port:
        type: string
    type: object
  entities.Column:
    properties:
      alias:
        type: string
      created_at:
        type: integer
      deleted_at:
        type: integer
      id:
        type: integer
      name:
        type: string
      order:
        type: integer
      size:
        type: integer
      table_id:
        type: integer
      updated_at:
        type: integer
    type: object
  entities.Dropdown:
    properties:
      text:
        type: string
      value:
        type: string
    type: object
  entities.Element:
    properties:
      column_type:
        type: string
      created_at:
        type: integer
      deleted_at:
        type: integer
      id:
        type: integer
      instance:
        $ref: '#/definitions/entities.Instance'
      instance_id:
        type: integer
      name:
        type: string
      report_id:
        type: integer
      row_num:
        type: integer
      space_name:
        type: string
      type:
        type: string
      uid:
        type: string
      updated_at:
        type: integer
    type: object
  entities.History:
    properties:
      bcc:
        items:
          type: string
        type: array
      cc:
        items:
          type: string
        type: array
      created_at:
        type: integer
      deleted_at:
        type: integer
      emailTime:
        type: integer
      executeTime:
        type: integer
      id:
        type: integer
      schedule:
        allOf:
        - $ref: '#/definitions/entities.Schedule'
        description: Schedule     Schedule `gorm:"foreignKey:ScheduleID;constraint:OnUpdate:CASCADE,OnDelete:SET
          NULL;"`
      scheduleID:
        type: integer
      scheduleName:
        type: string
      success:
        type: string
      to:
        description: |-
          ReportID     int      `gorm:"type:int"`
          Report       Report   `gorm:"foreignKey:ReportID;constraint:OnUpdate:CASCADE,OnDelete:SET NULL;"`
        items:
          type: string
        type: array
      updated_at:
        type: integer
    type: object
  entities.Instance:
    properties:
      auth:
        type: integer
      created_at:
        type: integer
      deleted_at:
        type: integer
      es_url:
        type: string
      id:
        type: integer
      name:
        type: string
      password:
        type: string
      type:
        type: string
      updated_at:
        type: integer
      url:
        type: string
      user:
        type: string
    type: object
  entities.MainMenu:
    properties:
      icon:
        type: string
      id:
        type: integer
      module:
        type: string
      router_path:
        type: string
      sort:
        type: integer
      title:
        type: string
    type: object
  entities.Module:
    properties:
      created_at:
        type: integer
      deleted_at:
        type: integer
      disabled:
        type: boolean
      id:
        type: integer
      name:
        type: string
      updated_at:
        type: integer
      url:
        type: string
    type: object
  entities.Report:
    properties:
      alias:
        type: string
      created_at:
        type: integer
      deleted_at:
        type: integer
      elements:
        items:
          $ref: '#/definitions/entities.Element'
        type: array
      id:
        type: integer
      name:
        type: string
      schedules:
        items:
          $ref: '#/definitions/entities.Schedule'
        type: array
      tables:
        description: DataTables []DataTable `gorm:"foreignKey:ReportID;constraint:OnUpdate:CASCADE,OnDelete:CASCADE;"`
        items:
          $ref: '#/definitions/entities.Table'
        type: array
      time_period:
        type: integer
      time_unit:
        type: string
      updated_at:
        type: integer
    type: object
  entities.Schedule:
