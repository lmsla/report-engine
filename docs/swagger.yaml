        type: integer
      member_id:
        type: integer
      member_name:
        type: string
      updated_at:
        type: integer
    type: object
  entities.Instance:
    properties:
      auth:
        type: boolean
      created_at:
        type: integer
      dashboards:
        description: Reports      []Report    `gorm:"many2many:Report_Instances;"`
        items:
          $ref: '#/definitions/entities.Dashboard'
        type: array
      deleted_at:
        type: integer
      instance_id:
        type: integer
      instance_name:
        type: string
      ip:
        type: string
      pass:
        type: string
      type:
        type: string
      updated_at:
        type: integer
      user:
        type: string
    type: object
  entities.RDashboard:
    properties:
      created_at:
        type: integer
      dashboard_id:
        type: integer
      dashboard_name:
        description: Instance []RInstance `gorm:"many2many:ins_and_dash;"`
        type: string
      deleted_at:
        type: integer
      instance_id:
        type: integer
      uid:
        description: ReportID    int    `json:"report_id" form:"report_id"`
        type: string
      updated_at:
        type: integer
    type: object
  entities.RInstance:
    properties:
      created_at:
        type: integer
      dashboard:
        items:
          $ref: '#/definitions/entities.RDashboard'
        type: array
      deleted_at:
        type: integer
      instance_id:
        type: integer
      instance_name:
        type: string
      ip:
        type: string
      pass:
        type: string
      report_id:
        type: integer
      type:
        type: string
      updated_at:
        type: integer
      user:
        type: string
    type: object
  entities.Report:
    properties:
      created_at:
        type: integer
      dashboard:
        items:
          $ref: '#/definitions/entities.RDashboard'
        type: array
      deleted_at:
        type: integer
      description:
        type: string
      from:
        type: string
      instance:
        items:
          $ref: '#/definitions/entities.RInstance'
        type: array
      name:
        type: string
      report_id:
        type: integer
      to:
        type: string
      type:
        type: string
      updated_at:
        type: integer
    type: object
  entities.Role:
    properties:
      created_at:
        type: integer
      dashboards:
        items:
          $ref: '#/definitions/entities.Dashboard'
        type: array
      deleted_at:
        type: integer
      role_id:
        type: integer
      role_name:
        type: string
      updated_at:
        type: integer
      users:
        items:
          $ref: '#/definitions/entities.User'
        type: array
    type: object
  entities.Schedule:
    properties:
      created_at:
        type: integer
      deleted_at:
        type: integer
      description:
        type: string
      generate_report:
        description: Report         string `json:"reports" form:"reports"`
        type: string
      group:
        items:
          $ref: '#/definitions/entities.Group'
        type: array
      report:
        items:
          $ref: '#/definitions/entities.Report'
        type: array
      schedule_id:
        type: integer
      schedule_name:
        type: string
      send_report:
        type: string
      status:
        type: string
      updated_at:
        type: integer
    type: object
  entities.User:
    properties:
      created_at:
        type: integer
      deleted_at:
        type: integer
      roles:
        items:
          $ref: '#/definitions/entities.Role'
        type: array
      updated_at:
        type: integer
      user_id:
        type: integer
      user_name:
        type: string
    type: object
  models.Response:
    properties:
      msg:
        type: string
      success:
        type: boolean
    type: object
