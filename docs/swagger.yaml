definitions:
  entities.Dashboard:
    properties:
      created_at:
        type: integer
      dashboard_id:
        type: integer
      dashboard_name:
        type: string
      deleted_at:
        type: integer
      instance_id:
        type: integer
      uid:
        type: string
      updated_at:
        type: integer
    type: object
