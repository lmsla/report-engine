      created_at:
        type: integer
      data_view:
        type: string
      deleted_at:
        type: integer
      id:
        type: integer
      instance:
        $ref: '#/definitions/entities.Instance'
      instance_id:
        type: integer
      name:
        type: string
      reports:
        items:
          $ref: '#/definitions/entities.Report'
        type: array
      row_num:
        type: integer
      space_name:
        type: string
      type:
        description: ReportID   int      `gorm:"index" json:"report_id" form:"report_id"`
        type: string
      uid:
        type: string
      updated_at:
        type: integer
    type: object
  models.Element:
    properties:
      column_type:
        type: string
      created_at:
        type: integer
      deleted_at:
        type: integer
      id:
        type: integer
      instance:
        $ref: '#/definitions/models.Instance'
      instance_id:
        type: integer
      name:
        type: string
      report_id:
        type: integer
      row_num:
        type: integer
      space_name:
        type: string
      type:
        type: string
      uid:
        type: string
      updated_at:
        type: integer
    type: object
  models.ErrorResponse:
    properties:
      error:
        example: error message
        type: string
    type: object
  models.Instance:
    properties:
      auth:
        type: integer
      es_url:
        type: string
      id:
        type: integer
      name:
        type: string
      password:
        type: string
      type:
        type: string
      url:
        type: string
      user:
        type: string
    type: object
  models.LoginRequest:
    properties:
      nas_port:
        example: "0"
        type: string
      password:
        example: password
        type: string
      username:
        example: admin
        type: string
    required:
    - password
    - username
    type: object
  models.LoginResponse:
    properties:
      token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      user:
        $ref: '#/definitions/models.UserInfo'
    type: object
  models.LogoutRequest:
    properties:
      access_accept:
        example: true
        type: boolean
      access_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    required:
    - access_accept
    - access_token
    type: object
  models.LogoutResponse:
    properties:
      msg:
        example: user logout success
        type: string
      success:
        example: true
        type: boolean
    type: object
  models.RadiusLoginRequest:
    properties:
      user_name:
        example: admin
        type: string
      user_password:
        example: password
        type: string
    required:
    - user_name
    - user_password
    type: object
  models.RadiusLoginResponse:
    properties:
      access_accept:
        example: true
        type: boolean
      access_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      user_domain:
        example: OPERATOR
        type: string
      user_role:
        example: VC_SUPER_USER
        type: string
    type: object
  models.Response:
    properties:
      body: {}
      msg:
        type: string
      success:
        type: boolean
    type: object
  models.UserInfo:
    properties:
      domain:
        example: radius
        type: string
      id:
        example: admin
        type: string
      name:
        example: admin
        type: string
      roles:
        example:
        - VC_SUPER_USER
        items:
          type: string
        type: array
    type: object
